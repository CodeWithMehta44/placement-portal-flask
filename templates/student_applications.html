{% extends 'base.html' %}

{% block content %}

<h2>My Applications</h2>

{% for app in applications %}
<div class="card p-3 mb-3">

    <h4>{{ app.drive.title }}</h4>
    <p>Description: {{ app.drive.description }}</p>
    <p>Status: 
    {% if app.status == "applied" %}
        pending
    {% else %}
        {{ app.status }}
    {% endif %}
</p>
</div>
{% endfor %}

{% endblock %}
