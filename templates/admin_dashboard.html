
    {% extends "base.html" %}

{% block content %}

<h2 class="mb-4">Admin Dashboard</h2>

<!-- Stats Cards -->
<div class="row g-4">

    <div class="col-md-3">
        <div class="card shadow-sm border-0 text-center p-3">
            <h6 class="text-muted">Students</h6>
            <h2>{{ total_students }}</h2>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card shadow-sm border-0 text-center p-3">
            <h6 class="text-muted">Companies</h6>
            <h2>{{ total_companies }}</h2>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card shadow-sm border-0 text-center p-3">
            <h6 class="text-muted">Drives</h6>
            <h2>{{ total_drives }}</h2>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card shadow-sm border-0 text-center p-3">
            <h6 class="text-muted">Applications</h6>
            <h2>{{ total_applications }}</h2>
        </div>
    </div>

</div>

<!-- Actions -->
<div class="mt-5">

    <h4 class="mb-3">Manage System</h4>

    <div class="d-flex gap-3 flex-wrap">

        <a href="/manage_companies" class="btn btn-primary">
            Manage Companies
        </a>

        <a href="/manage_drives" class="btn btn-dark">
            Manage Drives
        </a>

        <a href="/manage_users" class="btn btn-secondary">
            Manage Users
        </a>

    </div>

</div>

{% endblock %}
